name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with Ruff
        run: ruff check .

      - name: Fast unit tests
        run: |
          pytest agent/test_guardrails.py -v
          pytest agent/test_provider.py -v
          pytest evals/test_scorer.py -v
          pytest api/test_main.py -v

  live-evals-ollama:
    runs-on: ubuntu-latest
    needs: lint-and-test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &

          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is up"
              exit 0
            fi

            echo "Waiting for Ollama..."
            sleep 2
          done

          echo "Ollama failed to start"
          exit 1

      - name: Pull model
        run: ollama pull llama3.2:3b

      - name: Seed data
        run: |
          python data/db.py
          python scripts/ingest_stock_data.py
          python scripts/seed_portfolio.py
          python scripts/ingest_news.py
          python scripts/train_risk_model.py

      - name: Run live agent evals
        env:
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://localhost:11434
        run: python evals/run_evals.py --threshold 0.7

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t finsight:ci .