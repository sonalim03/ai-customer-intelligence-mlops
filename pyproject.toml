[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # module level import not at top — intentional: scripts do
             # sys.path.append(...) before importing sibling packages,
             # since this isn't installed as a package (no setup.py/pyproject
             # build). A cleaner v2 fix is a proper src-layout install, but
             # this pattern is common enough in portfolio/scaffold projects
             # not to fight it right now.
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
